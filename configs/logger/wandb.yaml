# https://wandb.ai

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  # name of the run - defaults to the model name (e.g. the GUI's "Model name" field).
  # if a run with this name already exists in the project, src.utils.utils.resolve_wandb_run_name
  # (called from train.py before loggers are instantiated) will append '_v2', '_v3', ... to it.
  name: "${model_name}"
  save_dir: "${paths.output_dir}"
  offline: False
  id: null # pass correct id to resume experiment!
  anonymous: null # enable anonymous logging
  project: "inobranda"
  log_model: False # upload lightning ckpts
  prefix: "" # a string to put at the beginning of metric keys
  entity: "easyodm" # set to name of your wandb team
  group: ""
  tags: []
  job_type: ""
