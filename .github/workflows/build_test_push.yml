name: Test and Deploy

on:
  push:
    branches: [main, cam]
    tags:
      - 'v*'
  pull_request:
    branches: [main, "release/*", "dev"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11"]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CI runners have no CUDA; the GPU onnxruntime wheel fails at import
          # on Linux (libcudart). Swap in the CPU build for tests only — the
          # Docker image keeps onnxruntime-gpu from requirements.txt.
          pip uninstall -y onnxruntime-gpu
          pip install onnxruntime
        shell: bash

      - name: Install sh (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: pip install sh

      - name: List dependencies
        run: python -m pip list

      - name: Run pytest
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Only run on pushes to main/workflow_test or tags, not on PRs
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Available disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "Available disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PASSWORD }}
      
      - name: Create dummy .env for CI
        run: |
          echo "host_config_dir=/tmp/configs" >> .env
          echo "host_data_dir=/tmp/data" >> .env
          echo "host_log_dir=/tmp/logs" >> .env

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            # latest only from the default branch; the cam branch publishes the
            # :cam variant so downstream consumers of :latest are never affected.
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=cam,enable=${{ github.ref == 'refs/heads/cam' }}

      # No provenance/SBOM attestations: they are pushed as UNTAGGED child
      # versions of a tagged index, which the untagged-version cleanup job then
      # deletes — leaving the tag pointing at missing manifests. A
      # single-platform build without attestations pushes one tagged manifest
      # that cleanup can never orphan.
      - name: Build and push
        uses: docker/bake-action@v5
        with:
          files: |
            docker-compose.yaml
          push: true
          provenance: false
          sbom: false
          set: |
            *.platform=linux/amd64
            # No provenance/SBOM attestations: they are pushed as UNTAGGED child
            # versions of a tagged index, which the untagged-version cleanup job
            # then deletes — leaving the tag pointing at missing manifests. A
            # single-platform build without attestations pushes one tagged
            # manifest that cleanup can never orphan.
            *.provenance=false
            *.sbom=false
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            deepvisionxplain.tags=${{ steps.meta.outputs.tags }}

  cleanup-old-packages:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Delete old packages
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'deepvisionxplain'
          package-type: 'container'
          min-versions-to-keep: 4
          # Keep every tagged version: rarely-updated tags (cam, v*) must not be
          # rotated out by frequent latest builds.
          delete-only-untagged-versions: true
          token: ${{ secrets.PASSWORD }}
